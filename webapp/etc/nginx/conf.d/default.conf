upstream node_app {
  server app:8080;
  keepalive 16;
  # Close idle sockets before Node's default five-second timeout.
  keepalive_timeout 4s;
}

server {
  listen 80;

  client_max_body_size 10m;
  root /public/;

  access_log /var/log/nginx/access.log ltsv;

  proxy_http_version 1.1;
  proxy_set_header Connection "";

  # Public assets bypass the application and support conditional requests.
  location ~ ^/(?:favicon\.ico|(?:css|js|img)/[^/]+\.(?:css|js|gif|png|jpg))$ {
    try_files $uri @image_app;
    expires 1d;
  }

  # Other filenames (including ID 0) keep the application's original behavior.
  location ~ ^/image/[1-9][0-9]*\.(jpg|png|gif)$ {
    try_files $uri @image_app;
    expires 1d;
  }

  location @image_app {
    proxy_set_header Host $host;
    proxy_pass http://node_app;
  }

  location / {
    proxy_set_header Host $host;
    proxy_pass http://node_app;
  }
}
